<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link
  href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
  rel="stylesheet"
/>
    <title>SunMall</title>
</head>
<body>
    <div class="container">
        <main>
            <header>
               
                    <div class="logo">
                        <img src="./logo.png" alt="logo">
                        <h3>SunMall</h3>
                    </div>
                     <nav>
                        <a href="#">HOME</a>
                        <a href="#">ABOUT</a>
                        <a href="#">CHIPS</a>
                        <a href="#">SERVICES</a>
                        <a href="#">CONTACT</a>
                </nav>
                <div class="search-bar">
                    <i class="ri-search-line" style="color:#efaa28"></i>
                    <input type="text" placeholder="Search for chips">
                    <div class="line"></div>
                    <i class="ri-shopping-bag-fill"></i>
                    <sup><p>4</p></sup>
                </div>
            </header>
            <section>
                <div class="left-section">
                    <div class="real-ingredients">
                        <i class="ri-star-fill"></i>
                        <p>100% REAL INGREDIENTS</p>
                    </div>
                    <h1>EAT OUR GRILLED<br>POTATO CHIPS</h1>

                    <P>Satisfying savory Chinese meat sauce chips<br>without any hard-to-find ingredients.</P>
                    <div class="button">
                        <button><i class="ri-shopping-basket-line"></i>ADD TO CART</button>
                        <div class="cart-num">
                            <p>-</p>
                            <div class="line"></div>
                            <p>2</p>
                            <div class="line"></div>
                            <p>+</p>
                        </div>
                    </div>
                </div>
                <div class="center-section"></div>
                <div class="right-section"></div>
            </section>
        </main>
    </div>
</body>
</html>
